name: java ci/cd pipeline v2
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - prod-branch
  pull_request:
    branches:
      - dev
      - prod-branch    

jobs:
  server_prep:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare server for deployment
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            # Update package lists
            sudo yum update -y

            # Install Java (OpenJDK 21)
            echo "Installing OpenJDK 21..."
            sudo yum install -y openjdk-21-jdk

            # Install Maven
            echo "Installing Maven..."
            sudo yum install -y maven

            # Install Git
            echo "Installing Git..."
            sudo yum install -y git

            # Verify installations
            java -version
            mvn -version
            git --version
          EOF

  sonar_scan:
    runs-on: ubuntu-latest
    needs: server_prep
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p sonar-artifacts
          cd CalculatorProject
          set -o pipefail
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.projectName=${{ secrets.SONAR_PROJECT_NAME }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.binaries=target/classes | tee ../sonar-artifacts/sonar-scan.log

      - name: Save Sonar scan details
        if: always()
        run: |
          mkdir -p sonar-artifacts
          echo "Repository: $GITHUB_REPOSITORY" > sonar-artifacts/sonar-summary.txt
          echo "Branch: $GITHUB_REF_NAME" >> sonar-artifacts/sonar-summary.txt
          echo "Commit: $GITHUB_SHA" >> sonar-artifacts/sonar-summary.txt
          if [ -f CalculatorProject/target/sonar/report-task.txt ]; then
            cp CalculatorProject/target/sonar/report-task.txt sonar-artifacts/
          fi
          if [ -d CalculatorProject/.scannerwork ]; then
            cp -R CalculatorProject/.scannerwork sonar-artifacts/.scannerwork || true
          fi

      - name: Upload Sonar scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-scan-report
          path: sonar-artifacts

  CI:
    runs-on: ubuntu-latest
    needs: sonar_scan
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: java setup
        uses: actions/setup-java@v5
        with:
            distribution: 'corretto'
            java-version: '21'

      - name: Build with Maven
        run: |
          cd CalculatorProject
          mvn clean install 

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CalculatorProject    
          path: CalculatorProject/target/CalculatorProject-1.0.jar

  CD:
    runs-on: ubuntu-latest
    needs: CI
    environment: 
      name: prod
    steps:
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          name: CalculatorProject

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 

      - name: copy artifact to EC2
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no CalculatorProject-1.0.jar ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/
          
      
      - name: Run the application on EC2
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            # Stop any existing instance of the application
            cd /home/ec2-user
            pkill -f 'java -jar CalculatorProject-1.0.jar' || true
            sleep 10
            nohup java -jar  CalculatorProject-1.0.jar > app.log 2>&1 & 
          EOF
          
      - name: Verify the application is running
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            # Check if the application is running
            ps -ef | grep java
          EOF



       
